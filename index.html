<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElanBazar</title>
<style>
  :root { --bg: #f4f5f7; --card: #ffffff; --border: #e3e5e9; --text: #1c1e21; --muted: #8b8f97; --accent: #178a5b; --vip: #ffb703; --vip-bg: #fff9e6; --danger: #d33a2c; --wa: #25D366; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 50; background: var(--accent); padding: 10px; color: #fff; }
  .h-row { display: flex; gap: 8px; align-items: center; }
  .logo { font-weight: bold; font-size: 18px; cursor: pointer; color: #fff; text-decoration: none; }
  .s-box { flex: 1; display: flex; background: #fff; border-radius: 6px; overflow: hidden; }
  .s-box input { flex: 1; border: none; padding: 8px; font-size: 14px; outline: none; }
  .s-box button { border: none; background: #fff; padding: 0 8px; cursor: pointer; }
  .user-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
  
  main { max-width: 480px; margin: 0 auto; padding: 12px; padding-bottom: 70px; }
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .cat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
  .cat-icon { font-size: 22px; }
  .cat-title { font-size: 13px; font-weight: bold; margin-top: 4px; }
  
  .sec-title { font-size: 16px; font-weight: bold; margin: 12px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  
  .item-card { display: flex; gap: 10px; position: relative; cursor: pointer; }
  .item-card.is-vip { background: var(--vip-bg); border-color: var(--vip); }
  .vip-badge { position: absolute; top: 6px; right: 6px; background: var(--vip); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
  .fav-btn { position: absolute; bottom: 6px; right: 6px; font-size: 18px; cursor: pointer; z-index: 2; }
  
  .item-img { width: 70px; height: 70px; background: #f0f2f5; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; overflow: hidden; }
  .item-img img { width: 100%; height: 100%; object-fit: cover; }
  .item-title { font-size: 14px; font-weight: 500; margin: 0 0 4px; padding-right: 20px; }
  .item-price { font-size: 15px; font-weight: bold; color: var(--accent); margin: 0 0 4px; }
  .item-meta { font-size: 11px; color: var(--muted); }
  
  .btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .btn-wa { background: var(--wa); }
  .inp { width: 100%; border: 1px solid var(--border); padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; outline: none; background: #fafafa; }
  label { font-size: 12px; font-weight: 600; color: #4a5568; display: block; margin-bottom: 4px; }
  
  .img-preview-grid { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; }
  .img-preview-item { width: 70px; height: 70px; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; flex-shrink: 0; }
  .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .gallery-img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }

  .b-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 50; }
  .b-nav a { flex: 1; text-align: center; padding: 8px 0; color: var(--muted); text-decoration: none; font-size: 11px; cursor: pointer; }
  .b-nav a.active { color: var(--accent); font-weight: bold; }
  
  .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; z-index: 100; }
</style>
</head>
<body>

<header>
  <div class="h-row">
    <a class="logo" onclick="goPage('home')">ElanBazar</a>
    <div class="s-box">
      <input type="text" id="s-input" placeholder="Axtarış...">
      <button onclick="search()">🔍</button>
    </div>
    <div id="u-header"></div>
  </div>
</header>

<main id="app"></main>

<div class="b-nav">
  <a id="n-home" onclick="goPage('home')">🏠<br>Ana Səhifə</a>
  <a id="n-fav" onclick="goPage('fav')">❤️<br>Seçilmişlər</a>
  <a id="n-add" onclick="goPage('add')">➕<br>Elan ver</a>
  <a id="n-my" onclick="goPage('my')">👤<br>Hesabım</a>
</div>

<div id="toast" class="toast"></div>

<script>
var CATS = [
  {id:'elektronika', name:'Elektronika', icon:'💻'},
  {id:'neqliyyat', name:'Nəqliyyat', icon:'🚗'},
  {id:'ehtiyat', name:'Ehtiyat hissələri', icon:'🔧'},
  {id:'emlak', name:'Daşınmaz Əmlak', icon:'🏠'},
  {id:'meiset', name:'Məişət texnikası', icon:'🍳'},
  {id:'telefon', name:'Telefonlar', icon:'📱'},
  {id:'is', name:'İş elanları', icon:'💼'}
];

var items = [];
var favorites = [];
var user = null;
var page = 'home';
var pageData = null;
var uploadedImages = [];

try {
  items = JSON.parse(localStorage.getItem('eb_items')) || [];
  favorites = JSON.parse(localStorage.getItem('eb_favs')) || [];
  user = JSON.parse(localStorage.getItem('eb_user')) || null;
} catch(e) {
  localStorage.clear();
}

function saveState() {
  try {
    localStorage.setItem('eb_items', JSON.stringify(items));
    localStorage.setItem('eb_favs', JSON.stringify(favorites));
    localStorage.setItem('eb_user', JSON.stringify(user));
  } catch(e) {}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2000);
}

function goPage(p, data) {
  page = p;
  pageData = data || null;
  uploadedImages = [];
  render();
  window.scrollTo(0, 0);
}

function search() {
  var q = document.getElementById('s-input').value.trim();
  if(q) goPage('search', q);
}

function toggleFav(id, e) {
  if(e) e.stopPropagation();
  var idx = favorites.indexOf(id);
  if(idx > -1) {
    favorites.splice(idx, 1);
    showToast('Çıxarıldı');
  } else {
    favorites.push(id);
    showToast('Əlavə olundu ❤️');
  }
  saveState();
  render();
}

function renderHeader() {
  var box = document.getElementById('u-header');
  if(user) {
    box.innerHTML = '<button class="user-btn" onclick="goPage(\'my\')">' + user.name + '</button>';
  } else {
    box.innerHTML = '<button class="user-btn" onclick="goPage(\'auth\')">Giriş</button>';
  }
}

function renderNav() {
  document.getElementById('n-home').className = page==='home'?'active':'';
  document.getElementById('n-fav').className = page==='fav'?'active':'';
  document.getElementById('n-add').className = page==='add'?'active':'';
  document.getElementById('n-my').className = page==='my'?'active':'';
}

function handleImageUpload(event) {
  var files = Array.from(event.target.files);
  uploadedImages = [];
  files.forEach(function(file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      uploadedImages.push(e.target.result);
      renderImagePreviews();
    };
    reader.readAsDataURL(file);
  });
}

function renderImagePreviews() {
  var container = document.getElementById('img-previews');
  if(!container) return;
  container.innerHTML = uploadedImages.map(function(src) {
    return '<img src="' + src + '" class="img-preview-item">';
  }).join('');
}

function render() {
  renderHeader();
  renderNav();
  var app = document.getElementById('app');

  if(page === 'home') {
    var html = '<div class="cat-grid">';
    CATS.forEach(function(c) {
      html += '<div class="cat-card" onclick="goPage(\'cat\', \'' + c.id + '\')">' +
        '<div class="cat-icon">' + c.icon + '</div>' +
        '<div class="cat-title">' + c.name + '</div>' +
      '</div>';
    });
    html += '</div><div class="sec-title">Son Elanlar</div>' + renderList(items);
    app.innerHTML = html;
  }
  else if(page === 'cat') {
    var list = items.filter(function(i){ return i.cat === pageData; });
    app.innerHTML = '<div class="sec-title">Kateqoriya Elanları</div>' + renderList(list);
  }
  else if(page === 'search') {
    var list = items.filter(function(i){ return i.title.toLowerCase().indexOf(pageData.toLowerCase()) > -1; });
    app.innerHTML = '<div class="sec-title">Axtarış: "' + pageData + '"</div>' + renderList(list);
  }
  else if(page === 'fav') {
    var list = items.filter(function(i){ return favorites.indexOf(i.id) > -1; });
    app.innerHTML = '<div class="sec-title">Seçilmişlər (' + list.length + ')</div>' + renderList(list);
  }
  else if(page === 'detail') {
    var item = items.find(function(i){ return i.id === pageData; });
    if(!item) { app.innerHTML = 'Elan tapılmadı'; return; }
    
    var imgs = (item.images && item.images.length > 0) 
      ? '<div class="gallery-grid">' + item.images.map(function(m){ return '<img src="' + m + '" class="gallery-img">'; }).join('') + '</div>'
      : '<div style="font-size:40px;text-align:center;padding:20px;background:#f0f2f5;">📦</div>';

    var cleanPhone = item.phone ? item.phone.replace(/[^0-9]/g, '') : '';

    app.innerHTML = '<div class="card">' +
      imgs +
      '<h2>' + item.title + '</h2>' +
      '<h3 style="color:var(--accent);">' + item.price + ' AZN</h3>' +
      '<p><b>Şəhər:</b> ' + item.city + '</p>' +
      '<p><b>Məlumat:</b> ' + (item.desc || 'Yoxdur') + '</p>' +
      '<hr>' +
      '<p><b>Satan:</b> ' + item.name + '</p>' +
      '<button class="btn" onclick="showToast(\'Əlaqə: ' + item.phone + '\')">📞 Nömrəni göster</button>' +
      (cleanPhone ? '<a href="https://wa.me/' + cleanPhone + '" target="_blank"><button class="btn btn-wa">💬 WhatsApp</button></a>' : '') +
    '</div>';
  }
  else if(page === 'add') {
    if(!user) {
      app.innerHTML = '<div class="card" style="text-align:center;"><p>Elan üçün daxil olun</p><button class="btn" onclick="goPage(\'auth\')">Daxil ol</button></div>';
      return;
    }
    app.innerHTML = '<div class="card">' +
      '<div class="sec-title">Yeni Elan</div>' +
      '<label>Başlıq</label><input type="text" id="f-title" class="inp" placeholder="iPhone 12">' +
      '<label>Kateqoriya</label><select id="f-cat" class="inp">' + CATS.map(function(c){ return '<option value="' + c.id + '">' + c.name + '</option>'; }).join('') + '</select>' +
      '<label>Qiymət</label><input type="number" id="f-price" class="inp" placeholder="100">' +
      '<label>Şəhər</label><input type="text" id="f-city" class="inp" value="Bakı">' +
      '<label>Telefon (WhatsApp: +994...)</label><input type="text" id="f-phone" class="inp" value="' + (user.contact||'') + '">' +
      '<label>Şəkillər (birdən çox seçin)</label><input type="file" class="inp" accept="image/*" multiple onchange="handleImageUpload(event)">' +
      '<div id="img-previews" class="img-preview-grid"></div>' +
      '<label>Ətraflı</label><textarea id="f-desc" class="inp"></textarea>' +
      '<button class="btn" onclick="submitAdd()">Dərc et</button>' +
    '</div>';
  }
  else if(page === 'my') {
    if(!user) { goPage('auth'); return; }
    var myItems = items.filter(function(i){ return i.uid === user.id; });
    app.innerHTML = '<div class="card">' +
      '<h3>' + user.name + '</h3>' +
      '<button class="btn" style="background:var(--danger);" onclick="logout()">Çıxış</button>' +
    '</div>' +
    '<div class="sec-title">Elanlarım (' + myItems.length + ')</div>' + renderList(myItems, true);
  }
  else if(page === 'auth') {
    app.innerHTML = '<div class="card">' +
      '<div class="sec-title">Daxil ol / Qeydiyyat</div>' +
      '<label>Ad Soyad</label><input type="text" id="r-name" class="inp" placeholder="Əli">' +
      '<label>Telefon / E-poçt</label><input type="text" id="r-contact" class="inp" placeholder="+994501234567">' +
      '<button class="btn" onclick="submitAuth()">Daxil ol</button>' +
    '</div>';
  }
}

function renderList(list, isMy) {
  if(!list.length) return '<div class="card" style="text-align:center;padding:20px;">Elan tapılmadı</div>';
  var html = '';
  list.forEach(function(i) {
    var thumb = (i.images && i.images.length > 0) ? '<img src="' + i.images[0] + '">' : '📦';
    var isFav = favorites.indexOf(i.id) > -1;
    html += '<div class="card item-card" onclick="goPage(\'detail\', \'' + i.id + '\')">' +
      '<div class="fav-btn" onclick="toggleFav(\'' + i.id + '\', event)">' + (isFav ? '❤️' : '🤍') + '</div>' +
      '<div class="item-img">' + thumb + '</div>' +
      '<div>' +
        '<div class="item-title">' + i.title + '</div>' +
        '<div class="item-price">' + i.price + ' AZN</div>' +
        '<div class="item-meta">' + i.city + '</div>' +
        (isMy ? '<button style="background:red;color:#fff;border:none;padding:4px;margin-top:4px;" onclick="event.stopPropagation();delItem(\'' + i.id + '\')">Sil</button>' : '') +
      '</div>' +
    '</div>';
  });
  return html;
}

function submitAdd() {
  var title = document.getElementById('f-title').value.trim();
  var price = document.getElementById('f-price').value;
  if(!title || !price) return showToast('Məlumatları doldurun!');
  
  items.unshift({
    id: Date.now().toString(),
    title: title,
    cat: document.getElementById('f-cat').value,
    price: price,
    city: document.getElementById('f-city').value,
    desc: document.getElementById('f-desc').value,
    images: uploadedImages,
    name: user.name,
    phone: document.getElementById('f-phone').value || user.contact,
    uid: user.id
  });
  saveState();
  goPage('my');
}

function submitAuth() {
  var name = document.getElementById('r-name').value.trim();
  var contact = document.getElementById('r-contact').value.trim();
  if(!name || !contact) return showToast('Xanaları doldurun!');
  user = { id: 'u_' + Date.now(), name: name, contact: contact };
  saveState();
  goPage('my');
}

function logout() {
  user = null;
  localStorage.removeItem('eb_user');
  goPage('home');
}

function delItem(id) {
  items = items.filter(function(i){ return i.id !== id; });
  saveState();
  render();
}

window.onload = render;
</script>
</body>
</html>
