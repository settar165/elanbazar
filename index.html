<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElanBazar</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --border: #e3e5e9;
    --text: #1c1e21; --muted: #8b8f97; --accent: #178a5b;
    --vip: #ffb703; --vip-bg: #fff9e6; --danger: #d33a2c; --wa: #25D366;
  }
  * { box-sizing: border-box; font-family: sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 70px; }
  
  header { position: sticky; top: 0; z-index: 50; background: var(--accent); padding: 10px; color: #fff; }
  .h-row { display: flex; gap: 8px; align-items: center; }
  .logo { font-weight: bold; font-size: 18px; color: #fff; text-decoration: none; cursor: pointer; }
  .s-box { flex: 1; display: flex; background: #fff; border-radius: 6px; overflow: hidden; }
  .s-box input { flex: 1; border: none; padding: 8px; font-size: 14px; outline: none; color: #000; }
  .s-box button { border: none; background: #fff; padding: 0 10px; cursor: pointer; }
  .user-btn { background: rgba(255,255,255,0.25); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }

  main { max-width: 500px; margin: 0 auto; padding: 12px; }

  .filter-box { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .filter-row { display: flex; gap: 8px; margin-top: 6px; }

  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .cat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
  .cat-icon { font-size: 22px; }
  .cat-title { font-size: 13px; font-weight: bold; margin-top: 4px; }

  .sec-title { font-size: 16px; font-weight: bold; margin: 12px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }

  .item-card { display: flex; gap: 10px; position: relative; cursor: pointer; }
  .item-card.is-vip { background: var(--vip-bg); border-color: var(--vip); }
  .vip-badge { position: absolute; top: 6px; right: 6px; background: var(--vip); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
  .fav-btn { position: absolute; bottom: 6px; right: 6px; font-size: 18px; cursor: pointer; z-index: 2; }

  .item-img { width: 75px; height: 75px; background: #eef1f5; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; overflow: hidden; }
  .item-img img { width: 100%; height: 100%; object-fit: cover; }
  .item-title { font-size: 14px; font-weight: 600; margin: 0 0 4px; padding-right: 20px; }
  .item-price { font-size: 15px; font-weight: bold; color: var(--accent); margin: 0 0 4px; }
  .item-meta { font-size: 11px; color: var(--muted); }

  .btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 11px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .btn-wa { background: var(--wa); text-align: center; text-decoration: none; display: block; }
  .btn-sm { font-size: 11px; padding: 5px 8px; border-radius: 4px; border: none; color: #fff; cursor: pointer; }

  .inp { width: 100%; border: 1px solid var(--border); padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; outline: none; background: #fafafa; }
  label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }

  .img-previews { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 10px; }
  .img-previews img { width: 65px; height: 65px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); }
  .gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
  .gallery img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }

  .comments { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 10px; }
  .c-item { background: #f8f9fa; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 6px; }

  .b-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 50; }
  .b-nav a { flex: 1; text-align: center; padding: 8px 0; color: var(--muted); text-decoration: none; font-size: 11px; cursor: pointer; }
  .b-nav a.active { color: var(--accent); font-weight: bold; }

  .toast { position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; z-index: 100; }
</style>
</head>
<body>

<header>
  <div class="h-row">
    <span class="logo" onclick="goPage('home')">ElanBazar</span>
    <div class="s-box">
      <input type="text" id="s-input" placeholder="Axtarış...">
      <button onclick="doSearch()">🔍</button>
    </div>
    <div id="u-head"></div>
  </div>
</header>

<main id="app"></main>

<div class="b-nav">
  <a id="n-home" onclick="goPage('home')">🏠<br>Ana Səhifə</a>
  <a id="n-fav" onclick="goPage('fav')">❤️<br>Seçilmişlər</a>
  <a id="n-add" onclick="goPage('add')">➕<br>Elan ver</a>
  <a id="n-my" onclick="goPage('my')">👤<br>Hesabım</a>
</div>

<div id="toast" class="toast"></div>

<script>
var CATS = [
  {id:'elektronika', name:'Elektronika', icon:'💻'},
  {id:'neqliyyat', name:'Nəqliyyat', icon:'🚗'},
  {id:'ehtiyat', name:'Ehtiyat hissələri', icon:'🔧'},
  {id:'emlak', name:'Daşınmaz Əmlak', icon:'🏠'},
  {id:'meiset', name:'Məişət texnikası', icon:'🍳'},
  {id:'telefon', name:'Telefonlar', icon:'📱'},
  {id:'is', name:'İş elanları', icon:'💼'}
];

var items = [];
var favorites = [];
var user = null;
var currentPage = 'home';
var pageParam = null;
var tempImages = [];

function loadData() {
  try { items = JSON.parse(localStorage.getItem('eb_items')) || []; } catch(e) { items = []; }
  try { favorites = JSON.parse(localStorage.getItem('eb_favs')) || []; } catch(e) { favorites = []; }
  try { user = JSON.parse(localStorage.getItem('eb_user')) || null; } catch(e) { user = null; }
}

function saveData() {
  try {
    localStorage.setItem('eb_items', JSON.stringify(items));
    localStorage.setItem('eb_favs', JSON.stringify(favorites));
    localStorage.setItem('eb_user', JSON.stringify(user));
  } catch(e){}
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(function(){ t.style.display = 'none'; }, 2000);
}

function goPage(p, param) {
  currentPage = p;
  pageParam = param || null;
  tempImages = [];
  render();
  window.scrollTo(0, 0);
}

function doSearch() {
  var q = document.getElementById('s-input').value.trim();
  if(q) goPage('search', q);
}

function toggleFav(id, ev) {
  if(ev) ev.stopPropagation();
  var idx = favorites.indexOf(id);
  if(idx > -1) { favorites.splice(idx, 1); showToast('Çıxarıldı'); }
  else { favorites.push(id); showToast('Əlavə olundu ❤️'); }
  saveData();
  render();
}

function handleFiles(e) {
  var files = Array.from(e.target.files);
  tempImages = [];
  files.forEach(function(file) {
    var r = new FileReader();
    r.onload = function(ev) {
      tempImages.push(ev.target.result);
      var box = document.getElementById('img-box');
      if(box) {
        box.innerHTML = tempImages.map(function(src){ return '<img src="'+src+'">'; }).join('');
      }
    };
    r.readAsDataURL(file);
  });
}

function render() {
  // Header user button
  var uh = document.getElementById('u-head');
  if(user) {
    uh.innerHTML = '<button class="user-btn" onclick="goPage(\'my\')">' + user.name + '</button>';
  } else {
    uh.innerHTML = '<button class="user-btn" onclick="goPage(\'auth\')">Giriş</button>';
  }

  // Nav active state
  document.getElementById('n-home').className = (currentPage==='home'?'active':'');
  document.getElementById('n-fav').className = (currentPage==='fav'?'active':'');
  document.getElementById('n-add').className = (currentPage==='add'?'active':'');
  document.getElementById('n-my').className = (currentPage==='my'?'active':'');

  var app = document.getElementById('app');

  if(currentPage === 'home') {
    var html = '<div class="cat-grid">';
    CATS.forEach(function(c) {
      html += '<div class="cat-card" onclick="goPage(\'cat\', \'' + c.id + '\')">' +
        '<div class="cat-icon">' + c.icon + '</div>' +
        '<div class="cat-title">' + c.name + '</div>' +
      '</div>';
    });
    html += '</div><div class="sec-title">Son Elanlar</div>' + renderList(items);
    app.innerHTML = html;
  }
  else if(currentPage === 'cat') {
    var list = items.filter(function(i){ return i.cat === pageParam; });
    app.innerHTML = '<div class="sec-title">Kateqoriya Elanları</div>' + renderList(list);
  }
  else if(currentPage === 'search') {
    var list = items.filter(function(i){ return i.title.toLowerCase().indexOf(pageParam.toLowerCase()) > -1; });
    app.innerHTML = '<div class="sec-title">Axtarış: "' + pageParam + '"</div>' + renderList(list);
  }
  else if(currentPage === 'fav') {
    var list = items.filter(function(i){ return favorites.indexOf(i.id) > -1; });
    app.innerHTML = '<div class="sec-title">Seçilmişlər (' + list.length + ')</div>' + renderList(list);
  }
  else if(currentPage === 'detail') {
    var item = items.find(function(i){ return i.id === pageParam; });
    if(!item) { app.innerHTML = 'Elan tapılmadı'; return; }

    var imgs = (item.images && item.images.length) ?
      '<div class="gallery">' + item.images.map(function(src){ return '<img src="'+src+'">'; }).join('') + '</div>' : '';

    var cleanPhone = item.phone ? item.phone.replace(/[^0-9]/g, '') : '';
    var waUrl = 'https://wa.me/' + cleanPhone + '?text=' + encodeURIComponent('Salam, ' + item.title + ' haqqında soruşmaq istəyirdim.');

    var coms = (item.comments || []).map(function(c){
      return '<div class="c-item"><b>' + c.author + ':</b> ' + c.text + '</div>';
    }).join('');

    app.innerHTML = '<div class="card">' +
      imgs +
      '<h2>' + item.title + '</h2>' +
      '<h3 style="color:var(--accent);">' + item.price + ' AZN</h3>' +
      '<p><b>Şəhər:</b> ' + item.city + '</p>' +
      '<p><b>Məlumat:</b> ' + (item.desc || 'Yoxdur') + '</p>' +
      '<hr style="border:none;border-top:1px solid var(--border);">' +
      '<p><b>Satan:</b> ' + item.name + '</p>' +
      '<button class="btn" onclick="showToast(\'Tel: ' + item.phone + '\')">📞 Nömrəni Göstər</button>' +
      (cleanPhone ? '<a href="' + waUrl + '" target="_blank" class="btn btn-wa">💬 WhatsApp ilə Yaz</a>' : '') +
      '<div class="comments">' +
        '<div class="sec-title">Rəylər</div>' + coms +
        '<input type="text" id="c-txt" class="inp" placeholder="Rəy yazın..." style="margin-top:8px;">' +
        '<button class="btn" style="padding:6px;" onclick="addComment(\'' + item.id + '\')">Göndər</button>' +
      '</div>' +
    '</div>';
  }
  else if(currentPage === 'add') {
    if(!user) {
      app.innerHTML = '<div class="card" style="text-align:center;"><p>Elan vermək üçün hesabınıza daxil olun</p><button class="btn" onclick="goPage(\'auth\')">Daxil ol</button></div>';
      return;
    }
    app.innerHTML = '<div class="card">' +
      '<div class="sec-title">Yeni Elan</div>' +
      '<label>Başlıq</label><input type="text" id="f-title" class="inp" placeholder="Nə satırsınız?">' +
      '<label>Kateqoriya</label><select id="f-cat" class="inp">' + CATS.map(function(c){ return '<option value="'+c.id+'">'+c.name+'</option>'; }).join('') + '</select>' +
      '<label>Qiymət (AZN)</label><input type="number" id="f-price" class="inp" placeholder="100">' +
      '<label>Şəhər</label><input type="text" id="f-city" class="inp" value="Bakı">' +
      '<label>Əlaqə (+994...)</label><input type="text" id="f-phone" class="inp" value="' + (user.contact||'') + '">' +
      '<label>Şəkillər</label><input type="file" class="inp" accept="image/*" multiple onchange="handleFiles(event)">' +
      '<div id="img-box" class="img-previews"></div>' +
      '<label>Ətraflı</label><textarea id="f-desc" class="inp"></textarea>' +
      '<button class="btn" onclick="saveNewItem()">Dərc Et (+5 Bonus)</button>' +
    '</div>';
  }
  else if(currentPage === 'my') {
    if(!user) { goPage('auth'); return; }
    var myItems = items.filter(function(i){ return i.uid === user.id; });
    app.innerHTML = '<div class="card">' +
      '<h3>' + user.name + '</h3>' +
      '<p>Bonus Balansınız: <b>' + (user.bonus||0) + ' B</b></p>' +
      '<button class="btn" style="background:var(--danger);" onclick="logout()">Çıxış Et</button>' +
    '</div>' +
    '<div class="sec-title">Elanlarım (' + myItems.length + ')</div>' + renderList(myItems, true);
  }
  else if(currentPage === 'auth') {
    app.innerHTML = '<div class="card">' +
      '<div class="sec-title">Daxil Ol / Qeydiyyat</div>' +
      '<label>Ad və Soyad</label><input type="text" id="r-name" class="inp" placeholder="Əli Məmmədov">' +
      '<label>Telefon və ya E-poçt</label><input type="text" id="r-contact" class="inp" placeholder="+994501234567">' +
      '<button class="btn" onclick="doAuth()">Daxil Ol</button>' +
    '</div>';
  }
}

function renderList(list, isMy) {
  if(!list.length) return '<div class="card" style="text-align:center;color:#888;">Elan tapılmadı</div>';
  var html = '';
  list.forEach(function(i) {
    var thumb = (i.images && i.images.length) ? '<img src="' + i.images[0] + '">' : '📦';
    var isFav = favorites.indexOf(i.id) > -1;
    html += '<div class="card item-card ' + (i.vip ? 'is-vip' : '') + '" onclick="goPage(\'detail\', \'' + i.id + '\')">' +
      (i.vip ? '<div class="vip-badge">VIP</div>' : '') +
      '<div class="fav-btn" onclick="toggleFav(\'' + i.id + '\', event)">' + (isFav ? '❤️' : '🤍') + '</div>' +
      '<div class="item-img">' + thumb + '</div>' +
      '<div style="flex:1;">' +
        '<div class="item-title">' + i.title + '</div>' +
        '<div class="item-price">' + i.price + ' AZN</div>' +
        '<div class="item-meta">' + i.city + '</div>' +
        (isMy ? '<div style="margin-top:6px;display:flex;gap:6px;" onclick="event.stopPropagation()">' +
          (!i.vip ? '<button class="btn-sm" style="background:var(--vip);" onclick="makeVip(\'' + i.id + '\')">VIP et (10B)</button>' : '') +
          '<button class="btn-sm" style="background:var(--danger);" onclick="deleteItem(\'' + i.id + '\')">Sil</button>' +
        '</div>' : '') +
      '</div>' +
    '</div>';
  });
  return html;
}

function saveNewItem() {
  var title = document.getElementById('f-title').value.trim();
  var price = document.getElementById('f-price').value;
  if(!title || !price) return showToast('Məlumatları doldurun!');

  items.unshift({
    id: 'i_' + Date.now(),
    title: title,
    cat: document.getElementById('f-cat').value,
    price: price,
    city: document.getElementById('f-city').value,
    phone: document.getElementById('f-phone').value,
    desc: document.getElementById('f-desc').value,
    images: tempImages,
    name: user.name,
    uid: user.id,
    vip: false,
    comments: []
  });

  user.bonus = (user.bonus || 0) + 5;
  saveData();
  showToast('Elan əlavə olundu!');
  goPage('my');
}

function doAuth() {
  var name = document.getElementById('r-name').value.trim();
  var contact = document.getElementById('r-contact').value.trim();
  if(!name || !contact) return showToast('Xanaları doldurun!');

  user = { id: 'u_' + Date.now(), name: name, contact: contact, bonus: 10 };
  saveData();
  showToast('Daxil oldunuz!');
  goPage('my');
}

function logout() {
  user = null;
  localStorage.removeItem('eb_user');
  goPage('home');
}

function addComment(id) {
  if(!user) return showToast('Daxil olun!');
  var txt = document.getElementById('c-txt').value.trim();
  if(!txt) return;
  var item = items.find(function(i){ return i.id === id; });
  if(item) {
    if(!item.comments) item.comments = [];
    item.comments.push({ author: user.name, text: txt });
    saveData();
    render();
  }
}

function makeVip(id) {
  if((user.bonus||0) < 10) return showToast('Kifayət qədər bonus yoxdur!');
  var item = items.find(function(i){ return i.id === id; });
  if(item) {
    item.vip = true;
    user.bonus -= 10;
    saveData();
    render();
  }
}

function deleteItem(id) {
  items = items.filter(function(i){ return i.id !== id; });
  saveData();
  render();
}

// Başlanğıc
loadData();
window.onload = render;
</script>
</body>
</html>
