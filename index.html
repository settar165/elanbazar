<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ElanBazar</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --border: #e3e5e9;
    --text: #1c1e21; --muted: #8b8f97; --accent: #178a5b;
    --vip: #ffb703; --vip-bg: #fff9e6; --danger: #d33a2c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
  header { position: sticky; top: 0; z-index: 50; background: var(--accent); padding: 10px; color: #fff; }
  .h-row { display: flex; gap: 8px; align-items: center; }
  .logo { font-weight: bold; font-size: 18px; cursor: pointer; color: #fff; text-decoration: none; }
  .s-box { flex: 1; display: flex; background: #fff; border-radius: 6px; overflow: hidden; }
  .s-box input { flex: 1; border: none; padding: 8px; font-size: 14px; outline: none; }
  .s-box button { border: none; background: #fff; padding: 0 8px; cursor: pointer; }
  .user-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
  
  main { max-width: 480px; margin: 0 auto; padding: 12px; padding-bottom: 70px; }
  
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
  .cat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; cursor: pointer; }
  .cat-icon { font-size: 22px; }
  .cat-title { font-size: 13px; font-weight: bold; margin-top: 4px; }
  
  .sec-title { font-size: 16px; font-weight: bold; margin: 12px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  
  .item-card { display: flex; gap: 10px; position: relative; cursor: pointer; }
  .item-card.is-vip { background: var(--vip-bg); border-color: var(--vip); }
  .vip-badge { position: absolute; top: 6px; right: 6px; background: var(--vip); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
  .item-img { width: 70px; height: 70px; background: #e0f2fe; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
  .item-title { font-size: 14px; font-weight: 500; margin: 0 0 4px; }
  .item-price { font-size: 15px; font-weight: bold; color: var(--accent); margin: 0 0 4px; }
  .item-meta { font-size: 11px; color: var(--muted); }
  
  .btn { width: 100%; background: var(--accent); color: #fff; border: none; padding: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 8px; }
  .btn-del { background: var(--danger); font-size: 12px; padding: 6px 10px; width: auto; margin: 0; }
  .btn-vip { background: var(--vip); font-size: 12px; padding: 6px 10px; width: auto; margin: 0; color: #fff; }
  
  .inp { width: 100%; border: 1px solid var(--border); padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  
  .b-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; z-index: 50; }
  .b-nav a { flex: 1; text-align: center; padding: 8px 0; color: var(--muted); text-decoration: none; font-size: 11px; cursor: pointer; }
  .b-nav a.active { color: var(--accent); font-weight: bold; }
  
  .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; display: none; z-index: 100; }
</style>
</head>
<body>

<header>
  <div class="h-row">
    <a class="logo" onclick="goPage('home')">ElanBazar</a>
    <div class="s-box">
      <input type="text" id="s-input" placeholder="Axtarış...">
      <button onclick="search()">🔍</button>
    </div>
    <div id="u-header"></div>
  </div>
</header>

<main id="app"></main>

<div class="b-nav">
  <a id="n-home" onclick="goPage('home')">🏠<br>Ana Səhifə</a>
  <a id="n-add" onclick="goPage('add')">➕<br>Elan ver</a>
  <a id="n-my" onclick="goPage('my')">👤<br>Hesabım</a>
</div>

<div id="toast" class="toast"></div>

<script>
const CATS = [
  {id:'tel', name:'Telefonlar', icon:'📱'},
  {id:'auto', name:'Nəqliyyat', icon:'🚗'},
  {id:'emlak', name:'Daşınmaz Əmlak', icon:'🏠'},
  {id:'elek', name:'Elektronika', icon:'💻'}
];

let items = JSON.parse(localStorage.getItem('eb_items')) || [
  {id:'1', title:'iPhone 13 Pro 128GB', cat:'tel', price:1350, city:'Bakı', name:'Əli', phone:'0501234567', desc:'Təmiz telefondur.', vip:true, uid:'0'},
  {id:'2', title:'BMW 525i 2002', cat:'auto', price:12000, city:'Gəncə', name:'Vusal', phone:'0559876543', desc:'Əla vəziyyətdə.', vip:false, uid:'0'}
];

let user = JSON.parse(localStorage.getItem('eb_user')) || null;
let page = 'home';
let pageData = null;

function saveState() {
  localStorage.setItem('eb_items', JSON.stringify(items));
  localStorage.setItem('eb_user', JSON.stringify(user));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

function goPage(p, data=null) {
  page = p;
  pageData = data;
  render();
  window.scrollTo(0, 0);
}

function search() {
  const q = document.getElementById('s-input').value.trim();
  if(q) goPage('search', q);
}

function renderHeader() {
  const box = document.getElementById('u-header');
  if(user) {
    box.innerHTML = `<button class="user-btn" onclick="goPage('my')">${user.name} (${user.bonus||0} B)</button>`;
  } else {
    box.innerHTML = `<button class="user-btn" onclick="goPage('auth')">Giriş</button>`;
  }
}

function renderNav() {
  document.getElementById('n-home').className = page==='home'?'active':'';
  document.getElementById('n-add').className = page==='add'?'active':'';
  document.getElementById('n-my').className = page==='my'?'active':'';
}

function render() {
  renderHeader();
  renderNav();
  const app = document.getElementById('app');

  if(page === 'home') {
    let html = `<div class="cat-grid">`;
    CATS.forEach(c => {
      html += `<div class="cat-card" onclick="goPage('cat', '${c.id}')">
        <div class="cat-icon">${c.icon}</div>
        <div class="cat-title">${c.name}</div>
      </div>`;
    });
    html += `</div><div class="sec-title">Son Elanlar</div>`;
    html += renderList(items);
    app.innerHTML = html;
  }
  else if(page === 'cat') {
    const list = items.filter(i => i.cat === pageData);
    app.innerHTML = `<div class="sec-title">Kateqoriya elanları</div>` + renderList(list);
  }
  else if(page === 'search') {
    const list = items.filter(i => i.title.toLowerCase().includes(pageData.toLowerCase()));
    app.innerHTML = `<div class="sec-title">Axtarış: "${pageData}"</div>` + renderList(list);
  }
  else if(page === 'detail') {
    const item = items.find(i => i.id === pageData);
    if(!item) return app.innerHTML = 'Elan tapılmadı';
    app.innerHTML = `
      <div class="card">
        <div style="font-size:40px;text-align:center;padding:20px;background:#e0f2fe;border-radius:6px;">📦</div>
        <h2>${item.title}</h2>
        <h3 style="color:var(--accent);">${item.price} AZN</h3>
        <p><b>Şəhər:</b> ${item.city}</p>
        <p><b>Məlumat:</b> ${item.desc || 'Yoxdur'}</p>
        <hr style="border:none;border-top:1px solid var(--border);">
        <p><b>Satan:</b> ${item.name}</p>
        <button class="btn" onclick="showToast('Əlaqə: ${item.phone}')">📞 Nömrəni göstər</button>
      </div>`;
  }
  else if(page === 'add') {
    if(!user) {
      app.innerHTML = `<div class="card" style="text-align:center;">
        <p>Elan vermək üçün hesabınıza daxil olun.</p>
        <button class="btn" onclick="goPage('auth')">Daxil ol / Qeydiyyat</button>
      </div>`;
      return;
    }
    app.innerHTML = `
      <div class="card">
        <div class="sec-title">Yeni Elan</div>
        <label>Başlıq</label>
        <input type="text" id="f-title" class="inp" placeholder="Məs: iPhone 12">
        <label>Kateqoriya</label>
        <select id="f-cat" class="inp">
          ${CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
        <label>Qiymət (AZN)</label>
        <input type="number" id="f-price" class="inp" placeholder="100">
        <label>Şəhər</label>
        <input type="text" id="f-city" class="inp" value="Bakı">
        <label>Ətraflı</label>
        <textarea id="f-desc" class="inp" placeholder="Məlumat..."></textarea>
        <button class="btn" onclick="submitAdd()">Dərc et (+5 bonus)</button>
      </div>`;
  }
  else if(page === 'my') {
    if(!user) return goPage('auth');
    const myItems = items.filter(i => i.uid === user.id);
    app.innerHTML = `
      <div class="card">
        <h3>${user.name}</h3>
        <p>Telefon: ${user.phone || 'Təyin edilməyib'}</p>
        <p>Balans: <b>${user.bonus||0} Bonus</b></p>
        <button class="btn" style="background:var(--danger);" onclick="logout()">Çıxış et</button>
      </div>
      <div class="sec-title">Elanlarım (${myItems.length})</div>
      ${renderList(myItems, true)}
    `;
  }
  else if(page === 'auth') {
    app.innerHTML = `
      <div class="card">
        <div class="sec-title">Giriş və ya Qeydiyyat</div>
        <label>Adınız</label>
        <input type="text" id="a-name" class="inp" placeholder="Məs: Əli">
        <label>Telefon</label>
        <input type="text" id="a-phone" class="inp" placeholder="0501234567">
        <button class="btn" onclick="submitAuth()">Daxil ol</button>
      </div>`;
  }
}

function renderList(list, isMy = false) {
  if(!list.length) return `<p style="text-align:center;color:var(--muted);">Elan tapılmadı.</p>`;
  let html = '';
  list.forEach(i => {
    html += `
      <div class="card item-card ${i.vip?'is-vip':''}" onclick="goPage('detail', '${i.id}')">
        ${i.vip ? `<div class="vip-badge">VIP</div>` : ''}
        <div class="item-img">📦</div>
        <div style="flex:1;">
          <div class="item-title">${i.title}</div>
          <div class="item-price">${i.price} AZN</div>
          <div class="item-meta">${i.city}</div>
          ${isMy ? `
            <div style="margin-top:6px;display:flex;gap:6px;" onclick="event.stopPropagation()">
              ${!i.vip ? `<button class="btn-vip" onclick="makeVip('${i.id}')">VIP et (10B)</button>` : ''}
              <button class="btn-del" onclick="delItem('${i.id}')">Sil</button>
            </div>
          ` : ''}
        </div>
      </div>`;
  });
  return html;
}

function submitAdd() {
  const title = document.getElementById('f-title').value.trim();
  const price = document.getElementById('f-price').value;
  if(!title || !price) return showToast('Başlıq və qiyməti yazın!');
  
  items.unshift({
    id: Date.now().toString(),
    title: title,
    cat: document.getElementById('f-cat').value,
    price: price,
    city: document.getElementById('f-city').value,
    desc: document.getElementById('f-desc').value,
    name: user.name,
    phone: user.phone || 'Qeyd edilməyib',
    uid: user.id,
    vip: false
  });
  
  user.bonus = (user.bonus || 0) + 5;
  saveState();
  showToast('Elan ekləndi! +5 Bonus');
  goPage('my');
}

function submitAuth() {
  const name = document.getElementById('a-name').value.trim();
  const phone = document.getElementById('a-phone').value.trim();
  if(!name) return showToast('Adınızı daxil edin!');
  
  user = { id: 'u_' + Date.now(), name: name, phone: phone, bonus: 10 };
  saveState();
  showToast('Xoş gəldiniz!');
  goPage('my');
}

function logout() {
  user = null;
  localStorage.removeItem('eb_user');
  showToast('Çıxış edildi.');
  goPage('home');
}

function makeVip(id) {
  if((user.bonus||0) < 10) return showToast('Kifayət qədər bonus yoxdur (10 B lazımdır)');
  const item = items.find(i => i.id === id);
  if(item) {
    item.vip = true;
    user.bonus -= 10;
    saveState();
    showToast('Elan VIP oldu!');
    render();
  }
}

function delItem(id) {
  items = items.filter(i => i.id !== id);
  saveState();
  showToast('Elan silindi.');
  render();
}

window.onload = render;
</script>
</body>
</html>
